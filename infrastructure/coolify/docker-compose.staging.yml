# ==============================================================================
# Naseebak (نصيبك) — Isolated Coolify Staging Docker Compose Stack
# Restricted Staging Environment (Separate Database, Separate Volumes, Sandbox Keys)
# Hard Memory Cap: Exactly 800 MB cumulative across all 5 containers
#
# ROUTING & COOLIFY INTEGRATION:
# - API & Filament Admin: https://naseebak-api.hazem.my (Container Port 8080)
# - Reverb WebSockets:   wss://naseebak-ws.hazem.my (Container Port 8081)
#
# Consistent Routing Configuration:
# Explicit Traefik labels below route external traffic through the host's
# Traefik reverse proxy on the 'coolify' network directly to ports 8080 and 8081.
# If configuring domains via Coolify UI, ensure the mapped ports are 8080 and 8081.
# ==============================================================================

services:
  naseebak-staging-postgres:
    image: postgres:16.4-alpine
    container_name: naseebak-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_DB_DATABASE:-naseebak_staging}
      POSTGRES_USER: ${STAGING_DB_USERNAME:-naseebak_staging_user}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD must be set}
      TZ: UTC
      PGTZ: UTC
    command: >
      postgres
      -c shared_buffers=48MB
      -c effective_cache_size=96MB
      -c work_mem=4MB
      -c max_connections=30
      -c timezone=UTC
    volumes:
      - naseebak_staging_pgdata:/var/lib/postgresql/data
    networks:
      - naseebak_staging_internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 224M
          cpus: "0.40"

  naseebak-staging-api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: naseebak/backend:${STAGING_IMAGE_TAG:-v1.0.0-rc1}
    container_name: naseebak-staging-api
    restart: unless-stopped
    depends_on:
      naseebak-staging-postgres:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: app
      PHP_FPM_MAX_CHILDREN: "3"
      APP_NAME: "${STAGING_APP_NAME:-Naseebak}"
      APP_ENV: staging
      APP_DEBUG: "${STAGING_APP_DEBUG:-false}"
      APP_KEY: ${STAGING_APP_KEY:?STAGING_APP_KEY must be set}
      APP_URL: ${STAGING_APP_URL:-https://naseebak-api.hazem.my}
      ADMIN_URL: ${STAGING_ADMIN_URL:-https://naseebak-api.hazem.my/admin}
      APP_TIMEZONE: UTC
      APP_LOCALE: ar
      LOG_CHANNEL: daily
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: naseebak-staging-postgres
      DB_PORT: "5432"
      DB_DATABASE: ${STAGING_DB_DATABASE:-naseebak_staging}
      DB_USERNAME: ${STAGING_DB_USERNAME:-naseebak_staging_user}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD must be set}
      FILESYSTEM_DISK: private
      PRIVATE_STORAGE_ROOT: /var/www/html/storage/app/private
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      TRUSTED_PROXIES: "*"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${STAGING_REVERB_APP_ID}
      REVERB_APP_KEY: ${STAGING_REVERB_APP_KEY}
      REVERB_APP_SECRET: ${STAGING_REVERB_APP_SECRET}
      REVERB_HOST: naseebak-staging-reverb
      REVERB_PORT: "8081"
      REVERB_SCHEME: http
      GOOGLE_ANDROID_CLIENT_ID: ${STAGING_GOOGLE_ANDROID_CLIENT_ID:-520721691788-0fki6oqjcsjtk6g9qbo2ean3fj3cpeq2.apps.googleusercontent.com}
      GOOGLE_WEB_CLIENT_ID: ${STAGING_GOOGLE_WEB_CLIENT_ID:-520721691788-4ngp8rrm7g4foja1f3ql24bv2apdgcoo.apps.googleusercontent.com}
      GOOGLE_PLAY_PACKAGE_NAME: ${STAGING_GOOGLE_PLAY_PACKAGE_NAME:-com.naseebak.app}
      GOOGLE_PLAY_MONTHLY_SUBSCRIPTION_ID: ${STAGING_GOOGLE_PLAY_MONTHLY_SUBSCRIPTION_ID:-naseebak_monthly_membership}
      MAIL_MAILER: ${STAGING_MAIL_MAILER:-log}
      MAIL_HOST: ${STAGING_MAIL_HOST:-127.0.0.1}
      MAIL_PORT: "${STAGING_MAIL_PORT:-587}"
      MAIL_USERNAME: ${STAGING_MAIL_USERNAME:-}
      MAIL_PASSWORD: ${STAGING_MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${STAGING_MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${STAGING_MAIL_FROM_ADDRESS:-noreply@hazem.my}
      MAIL_FROM_NAME: "${STAGING_MAIL_FROM_NAME:-نَصِيبُكَ}"
    volumes:
      - naseebak_staging_private_photos:/var/www/html/storage/app/private
    networks:
      - naseebak_staging_internal
      - coolify
    expose:
      - "8080"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.naseebak-staging-api.rule=Host(`${STAGING_API_DOMAIN:-naseebak-api.hazem.my}`)"
      - "traefik.http.routers.naseebak-staging-api.entrypoints=https"
      - "traefik.http.routers.naseebak-staging-api.tls=true"
      - "traefik.http.routers.naseebak-staging-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.naseebak-staging-api.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  naseebak-staging-worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: naseebak/backend:${STAGING_IMAGE_TAG:-v1.0.0-rc1}
    container_name: naseebak-staging-worker
    restart: unless-stopped
    depends_on:
      naseebak-staging-postgres:
        condition: service_healthy
      naseebak-staging-api:
        condition: service_started
    environment:
      CONTAINER_ROLE: worker
      WORKER_MEMORY: "96"
      APP_ENV: staging
      APP_DEBUG: "${STAGING_APP_DEBUG:-false}"
      APP_KEY: ${STAGING_APP_KEY}
      APP_URL: ${STAGING_APP_URL:-https://naseebak-api.hazem.my}
      DB_CONNECTION: pgsql
      DB_HOST: naseebak-staging-postgres
      DB_PORT: "5432"
      DB_DATABASE: ${STAGING_DB_DATABASE:-naseebak_staging}
      DB_USERNAME: ${STAGING_DB_USERNAME:-naseebak_staging_user}
      DB_PASSWORD: ${STAGING_DB_PASSWORD}
      FILESYSTEM_DISK: private
      PRIVATE_STORAGE_ROOT: /var/www/html/storage/app/private
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${STAGING_REVERB_APP_ID}
      REVERB_APP_KEY: ${STAGING_REVERB_APP_KEY}
      REVERB_APP_SECRET: ${STAGING_REVERB_APP_SECRET}
      REVERB_HOST: naseebak-staging-reverb
      REVERB_PORT: "8081"
      REVERB_SCHEME: http
      GOOGLE_PLAY_PACKAGE_NAME: ${STAGING_GOOGLE_PLAY_PACKAGE_NAME:-com.naseebak.app}
      GOOGLE_PLAY_MONTHLY_SUBSCRIPTION_ID: ${STAGING_GOOGLE_PLAY_MONTHLY_SUBSCRIPTION_ID:-naseebak_monthly_membership}
      MAIL_MAILER: ${STAGING_MAIL_MAILER:-log}
      MAIL_HOST: ${STAGING_MAIL_HOST:-127.0.0.1}
      MAIL_PORT: "${STAGING_MAIL_PORT:-587}"
      MAIL_USERNAME: ${STAGING_MAIL_USERNAME:-}
      MAIL_PASSWORD: ${STAGING_MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${STAGING_MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${STAGING_MAIL_FROM_ADDRESS:-noreply@hazem.my}
      MAIL_FROM_NAME: "${STAGING_MAIL_FROM_NAME:-نَصِيبُكَ}"
    volumes:
      - naseebak_staging_private_photos:/var/www/html/storage/app/private
    networks:
      - naseebak_staging_internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  naseebak-staging-reverb:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: naseebak/backend:${STAGING_IMAGE_TAG:-v1.0.0-rc1}
    container_name: naseebak-staging-reverb
    restart: unless-stopped
    depends_on:
      naseebak-staging-postgres:
        condition: service_healthy
      naseebak-staging-api:
        condition: service_started
    environment:
      CONTAINER_ROLE: reverb
      APP_ENV: staging
      APP_DEBUG: "${STAGING_APP_DEBUG:-false}"
      APP_KEY: ${STAGING_APP_KEY}
      APP_URL: ${STAGING_APP_URL:-https://naseebak-api.hazem.my}
      DB_CONNECTION: pgsql
      DB_HOST: naseebak-staging-postgres
      DB_PORT: "5432"
      DB_DATABASE: ${STAGING_DB_DATABASE:-naseebak_staging}
      DB_USERNAME: ${STAGING_DB_USERNAME:-naseebak_staging_user}
      DB_PASSWORD: ${STAGING_DB_PASSWORD}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${STAGING_REVERB_APP_ID}
      REVERB_APP_KEY: ${STAGING_REVERB_APP_KEY}
      REVERB_APP_SECRET: ${STAGING_REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8081"
      REVERB_HOST: ${STAGING_REVERB_PUBLIC_HOST:-naseebak-ws.hazem.my}
      REVERB_PORT: "443"
      REVERB_SCHEME: ${STAGING_REVERB_PUBLIC_SCHEME:-https}
    networks:
      - naseebak_staging_internal
      - coolify
    expose:
      - "8081"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.naseebak-staging-reverb.rule=Host(`${STAGING_WS_DOMAIN:-naseebak-ws.hazem.my}`)"
      - "traefik.http.routers.naseebak-staging-reverb.entrypoints=https"
      - "traefik.http.routers.naseebak-staging-reverb.tls=true"
      - "traefik.http.routers.naseebak-staging-reverb.tls.certresolver=letsencrypt"
      - "traefik.http.services.naseebak-staging-reverb.loadbalancer.server.port=8081"
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.15"

  naseebak-staging-scheduler:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: naseebak/backend:${STAGING_IMAGE_TAG:-v1.0.0-rc1}
    container_name: naseebak-staging-scheduler
    restart: unless-stopped
    depends_on:
      naseebak-staging-postgres:
        condition: service_healthy
      naseebak-staging-api:
        condition: service_started
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: staging
      APP_DEBUG: "${STAGING_APP_DEBUG:-false}"
      APP_KEY: ${STAGING_APP_KEY}
      APP_URL: ${STAGING_APP_URL:-https://naseebak-api.hazem.my}
      DB_CONNECTION: pgsql
      DB_HOST: naseebak-staging-postgres
      DB_PORT: "5432"
      DB_DATABASE: ${STAGING_DB_DATABASE:-naseebak_staging}
      DB_USERNAME: ${STAGING_DB_USERNAME:-naseebak_staging_user}
      DB_PASSWORD: ${STAGING_DB_PASSWORD}
      FILESYSTEM_DISK: private
      PRIVATE_STORAGE_ROOT: /var/www/html/storage/app/private
      CACHE_STORE: database
    volumes:
      - naseebak_staging_private_photos:/var/www/html/storage/app/private
    networks:
      - naseebak_staging_internal
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.15"

volumes:
  naseebak_staging_pgdata:
    name: naseebak_staging_pgdata
  naseebak_staging_private_photos:
    name: naseebak_staging_private_photos

networks:
  naseebak_staging_internal:
    name: naseebak_staging_internal
    driver: bridge
  coolify:
    external: true
