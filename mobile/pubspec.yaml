name: naseebak_mobile
description: "نصيبك — Naseebak: Arabic Matrimonial Platform for Adults (18+)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Authentication (Google Sign-In ONLY — NO Firebase Auth)
  google_sign_in: ^6.2.1

  # Secure Session Storage
  flutter_secure_storage: ^9.2.2

  # HTTP Networking & Real-Time WebSockets (Laravel Reverb)
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1

  # Push Notifications (Firebase Core & Firebase Messaging EXCLUSIVELY for FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Google Play Billing (In-App Subscriptions)
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.6+8

  # Image Picking & Local Compression (Shared VPS optimization)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Typography & Formatting
  google_fonts: ^6.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
